name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['client/**', 'shared/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Check public content
        run: node ../tools/check-publication.mjs
      - run: npm test
      - name: Build client
        run: |
          test -n "$VITE_GAME_SERVER_URL" || { echo "Game server build setting is missing"; exit 1; }
          npm run build
        env:
          VITE_GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
